# Что обязано и что не должно прозвучать в сказках (tests/stories/*.txt). Проверка — tests/test_stories.py.
# Ожидания — по смыслу сказки (как сделал бы звукорежиссёр), а не по тому, что движок выдаёт сейчас.
#
# expect:    {вид: [id]}  — хотя бы раз за сказку. Виды: sfx, char, leave, scene, overlay_on, mood.
# forbid:    {вид: [id]}  — ни разу.
# forbid_in: [{words: регулярка, вид: [id]}] — не на фразах, где есть эти слова.
# limits:    слов рассказа на одну смену сцены / настроения — не меньше (сцена 64 → не чаще раза в 64 слова).
#             Считаем по словам, не по фразам: у голоса фразы — паузы Vosk (длиннее), у текста — точки.
#             64 / 120 ≈ прежние 8 / 15 фраз по 8 слов.
# known_failing: проверки, которые сейчас не проходят в текстовом прогоне; known_failing_voice — в голосовом (задача 23, docs/review-2026-11-13.md).
#   Такие тесты помечены «ожидаемо падает»; если проверка начала проходить — тест упадёт и попросит
#   убрать её из списка. Имена: expect:sfx:splash, forbid:sfx:coins, forbid_in:0, limit:scene, limit:mood.

defaults:
  limits: {scene: 64, mood: 120}

stories:
  rybak:
    expect:
      char: [old_man, old_woman, magic]
      scene: [sea]
      sfx: [splash]                       # «хвостом по воде плеснула»
      overlay_on: [storm]                 # «на море черная буря»
    forbid:
      sfx: [coins, door_creak, door_knock, sword_clash]   # «золотая рыбка», «воротился», «топорики держат»
      scene: [forest, battle]             # «дубовыми вороты»
    forbid_in:
      - {words: "грозн", overlay_on: [storm]}             # «грозная стража» — не гроза
      - {words: "крестьянк", scene: [village]}           # «не хочу быть крестьянкой» — речь, не место
      - {words: "воем и воют", sfx: [wolf_howl]}         # воют волны — решено по голому слову «воют» (шаг 3)
    known_failing: []          # «с дубовыми вороты» — описание избы, исправлено примерами door._none (2026-11-16)
    known_failing_voice:
      - forbid:scene:battle     # Vosk: «у ворот» → «утру бою», «вольною» → «войною»

  kolobok:
    expect:
      char: [old_man, old_woman, hare, wolf, bear, fox]
      scene: [home]                       # «из чего печь-то», изба
    forbid:
      sfx: [wolf_howl, bird]              # звери не воют от одного «навстречу ему»; колобок поёт, не птицы
      leave: [old_man, old_woman, hare, wolf, bear, fox]  # «я у дедушки ушёл» — ушёл колобок
    known_failing: []
    known_failing_voice: []

  morozko:
    expect:
      char: [old_man, old_woman, frost]
      scene: [home, forest]
      overlay_on: [snow]                  # «трескучий мороз»
      sfx: [bell, sleigh_bells, frost_crackle]   # «с колокольцом», «запряг кобылу в дровни», «потрескивает»
    forbid:
      sfx: [wolf_howl]                    # «девка завыла»
      char: [dog]                         # «старый пёс» — ругательство
      overlay_on: [storm]                 # «как гроза разразилась» — сравнение
    forbid_in:
      - {words: "запряг", sfx: [horse_gallop]}           # запрячь — не скакать
      - {words: "свалил", sfx: [fall]}                   # «деток свалил» в сани
    known_failing: []
    known_failing_voice:
      - expect:sfx:bell          # Vosk: «с колокольцом» → «скала кольцом»
      - expect:sfx:sleigh_bells  # Vosk: «в дровни» → «в дров в не»

  gusi:
    expect:
      char: [old_man, old_woman, goose, hedgehog, witch]
      leave: [goose]                      # «пропали за тёмным лесом», «улетели»
      scene: [meadow, forest, river]
    forbid:
      sfx: [coins, door_creak]            # «золотыми яблочками», «гуси воротились»
      scene: [city]                       # «побежала на улицу» — деревня
    forbid_in:
      - {words: "подхватили мальчика", char: [child]}    # мальчика уносят — детский смех не к месту
      - {words: "ходи со двор", scene: [village]}        # «не ходи со двора» — реплика матери, не место
    known_failing: []          # смех при «подхватили мальчика» — quiet_words; «за тёмным лесом» — far_words (2026-11-16)
    known_failing_voice:
      - expect:char:old_man       # Vosk: «жили старик со старухой» → «жили историче икса старушка»

  owner_sea:
    expect:
      char: [old_man, old_woman, hen]
      scene: [sea]
      overlay_on: [storm]                 # «начался шторм»
      sfx: [thunder, splash]              # «гром гремит», «закинул невод»
    forbid_in:
      - {words: "(?<!не )вытащил", sfx: [splash]}      # невод тянут из воды — не всплеск; «закинул… и не вытащил» — всплеск есть
    known_failing: []
    known_failing_voice: []       # «закинул не вот» — якорь «закинул*» (2026-11-16)

  owner_bear:
    expect:
      char: [old_man, bear]
      scene: [forest]
      sfx: [gunshot]                      # «прицелился и выстрелил», «снова бах выстрел»
    forbid:
      scene: [village]                    # «мужик испугался и бежать» — всё ещё лес
      sfx: [arrow]                        # ружьё — не стрела
    forbid_in:
      - {words: "шелохнется", sfx: [roar]}               # медведь стоит молча
    known_failing: []
    known_failing_voice: []

  dnd_crypt:                              # задача 24: приключение ДнД
    # сжатый текст: 4 эпизода за 190 слов (лагерь — бой — склеп — таверна), смены настроения тут по делу
    limits: {scene: 40, mood: 50}
    expect:
      char: [dwarf, elf, skeleton, goblin, werewolf, villain, zombie, innkeeper, bard]
      scene: [camp, graveyard, tavern]
      sfx: [torch_light, paper, war_cry, heavy_hit, stab, death_cry, lock_click, door_creak, chest_open, trap_click,
            portcullis, fireball, magic_shield, summon, chains, heal, drink, rockfall]
    forbid:
      sfx: [gunshot, sleigh_bells, coins]
      scene: [sea, village]
    forbid_in:
      - {words: "кладбищ", sfx: [rockfall]}             # «вышли к кладбищу» — не обвал
    known_failing: []
    known_failing_voice: []
