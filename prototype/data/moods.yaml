# Настроение рассказа → фоновая музыка (sounds/music/<music>.wav, синтезируется tools/gen_music.py).
# Угадывается как сцена (storyfx/scenes.py): по смыслу последних слов + ключевые слова + подтверждение.
# Формат keywords — как в scenes.yaml. Порядок не важен; стартовое настроение — default.
default: calm

moods:
  calm:
    music: calm
    descriptions:
      - "жили-были старик со старухой, жили тихо и мирно"
      - "тихий тёплый вечер, все отдыхают и неторопливо беседуют"
      - "медленно шли по дороге, вокруг тишина и покой"
      - "герои устроились на ночлег и спокойно уснули"
    keywords: ["тишин*", "спокойн*", "мирн*", "отдыха*", "уснул*", "заснул*", "нетороплив*"]   # без «покой»: «не даёт покою»
  cheerful:
    music: cheerful
    descriptions:
      - "все радовались, смеялись и веселились"
      - "устроили пир на весь мир, играла музыка и все плясали"
      - "звери весело играли и прыгали на солнечной полянке"
      - "свадьбу сыграли, и стали жить-поживать да добра наживать"
    keywords: ["весел*", "радост*", "радова*", "смея*", "засмея*", "смех*", "пляс*", "праздник*", "пир", "свадьб*", "ликова*"]
  tense:
    music: tense
    descriptions:
      - "вдруг стало тихо и страшно, в темноте что-то шевельнулось"
      - "кто-то крадётся следом, за спиной слышны шаги"
      - "избушка Бабы-яги, кругом кости и черепа, жутко"
      - "сердце замерло от страха, герои затаили дыхание"
    keywords: ["страш*", "страх*", "жутк*", "жуть", "испуга*", "тревог*", "зловещ*", "крад*", "затаил*", "боязн*"]
  action:
    music: action
    descriptions:
      - "закипел бой, звенят мечи, враги нападают со всех сторон"
      - "погоня, кони мчатся во весь опор"
      - "дракон бросился в атаку, герои отбиваются изо всех сил"
      - "бегите скорее, спасайтесь, некогда раздумывать"
    keywords: ["погон*", "мчал*", "мчит*", "атак*", "нападен*", "напал*", "бой", "битв*", "сражени*", "спасайт*", "бегит*"]
