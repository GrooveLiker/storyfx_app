# Сцены (основной фон) и наложения (погода, огонь, ночь). Формат — docs/sounds.md
# ambience = имя файла sounds/ambience/<id>.wav
# keywords: основа слова («двор» → двора, двору; но не «дворец») или префикс со «*» (`изб*`)
# home, village, swamp добавлены по разбору 100 сказок — docs/fairytales.md
# far_words: слово-место сразу после них (до 2 слов) — это где-то вдали, а не где герой:
#   «выбежала в чистое поле… пропали за тёмным лесом» — героиня в поле («Гуси-лебеди»).
far_words: ["за", "вдали", "вдалеке", "вдалеко"]

scenes:
  forest:
    ambience: forest
    descriptions:
      - "густой лес, высокие деревья, шелест листвы и пение птиц"
      - "тропинка петляет среди сосен и елей в лесной чаще"
      - "путники пробираются через кусты и бурелом"
    keywords: ["лес", "чащ*", "опушк*", "дерев", "сосн*", "елк*", "роща", "дуб", "бор"]   # без «лесн*», «дуб*»: «лесное яблоко», «дубовые ворота» — не лес
  meadow:
    ambience: meadow
    descriptions:
      - "открытое поле, луг с цветами и травой, светит солнце"
      - "дорога тянется через холмы и равнины"
    keywords: ["пол", "луг*", "лужайк*", "холм*", "равнин*", "тракт", "степ*"]
  river:
    ambience: river
    descriptions:
      - "журчит река, вода бежит по камням"
      - "у берега ручья, мост через речку"
    keywords: ["рек*", "речк*", "ручей", "ручь*", "ручеек", "мост*", "водопад*", "брод*"]
  sea:
    ambience: sea
    descriptions:
      - "шумит море, волны накатывают на берег"
      - "корабль плывет по океану, на палубе пахнет солью"
    keywords: ["мор", "морск*", "океан*", "волн", "корабл*", "палуб*", "пляж*", "прибо*", "порт", "пират*"]
  cave:
    ambience: cave
    descriptions:
      - "темная пещера, с потолка капает вода, эхо шагов"
      - "подземелье, сырые каменные коридоры и туннели"
    keywords: ["пещер*", "подзем*", "туннел*", "грот*", "шахт*", "катакомб*", "склеп*", "логов*"]
  castle:
    ambience: castle
    descriptions:
      - "огромный каменный зал замка, высокие своды и факелы"
      - "дворец короля, тронный зал и длинные коридоры"
    keywords: ["замок", "замк*", "дворц*", "дворец", "трон", "тронн*", "крепост*", "башн*", "зал", "корол*", "принцесс*"]
  tavern:
    ambience: tavern
    descriptions:
      - "шумная таверна, люди пьют эль, смеются и разговаривают"
      - "трактир, у очага сидят путники, трактирщик наливает кружки"
    keywords: ["таверн*", "трактир*", "харчевн*", "постоял* двор*", "кабак*", "эль", "кружк*", "трактирщик*"]
  city:
    ambience: city
    descriptions:
      - "многолюдная городская площадь, рынок и торговцы"
      - "улицы города, повозки и прохожие"
    keywords: ["город*", "площад*", "рынок", "рынк*", "базар*", "ярмарк*"]
  home:
    ambience: home
    descriptions:
      - "в избе тепло, потрескивает печь, тикают часы-ходики"
      - "в горнице за столом у окна сидит бабушка и прядёт"
      - "в маленьком домике тихо, скрипят половицы"
    keywords: ["изб*", "горниц*", "светлиц*", "печ", "печк*", "дом", "домик*", "хат", "терем*", "комнат*", "кухн*", "лавк*", "окошечк*", "сени", "сеней", "сенях", "горенк*"]   # лавка, окошко, сени — внутри избы
  village:
    ambience: village
    descriptions:
      - "деревня, во дворе кукарекает петух и кудахчут куры"
      - "утро в деревне, кричат петухи и мычат коровы"
      - "на скотном дворе блеют овцы, хрюкают поросята и гогочут гуси"
      - "за избой огород, хлев и сарай, дед вышел на крыльцо"
    keywords: ["деревн*", "деревеньк*", "двор", "огород*", "хлев*", "курятник*", "амбар*", "околиц*", "сельск*"]
  swamp:
    ambience: swamp
    descriptions:
      - "топкое болото, квакают лягушки, булькает трясина"
      - "кочки и камыши, над болотом стелется туман"
    keywords: ["болот*", "трясин*", "камыш*", "кочк*", "топ", "тин", "осок*", "кувшинк*"]
  battle:
    ambience: battle
    descriptions:
      - "идет битва, звенят мечи, кричат воины"
      - "сражение армий на поле боя"
    keywords: ["битв*", "сражени*", "бой", "бою", "атак*", "войн*", "армия", "армии"]

overlays:   # слои поверх сцены; включаются ключевыми словами, выключаются stop
  rain:
    ambience: rain
    keywords: ["дожд*", "ливен*", "ливн*", "морос*", "капл*"]
    stop: ["дожд* законч*", "дожд* прекрат*", "дожд* стих*", "выглянул* солнц*"]
  storm:
    ambience: storm
    keywords: ["гроза", "бур", "шторм*", "ураган*"]   # «гроза» — основа «гроз», не ловит «грозный»
    stop: ["гроз* законч*", "бур* стих*", "бур* законч*", "шторм* стих*", "выглянул* солнц*"]
  wind:
    ambience: wind
    keywords: ["ветер", "ветр*", "ветерок"]
    stop: ["ветер стих*", "ветер утих*", "безветр*"]
  snow:
    ambience: snow
    keywords: ["снег*", "снеж*", "метел*", "вьюг*", "мороз*", "зим*", "сугроб*"]
    stop: ["снег растая*", "наступил* весн*"]
  fire:
    ambience: fire
    keywords: ["костер", "костр*", "очаг*", "камин*"]
    stop: ["костер погас*", "огон* погас*", "потушил*"]
  night:
    ambience: night
    keywords: ["ноч*", "полноч*", "звезд*", "лун*"]
    stop: ["рассвет*", "утр*", "поутру", "наутро", "заря", "зари", "взошл* солнц*", "наступил* ден*"]
