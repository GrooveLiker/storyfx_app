# Триггеры звуков действий. Формат и правила — docs/sounds.md
# id = имя файла sounds/sfx/<id>.wav
# phrases: слова сравниваются по основам (ударил = ударила = удар).
#          слово со * на конце — «начинается с» (гром* → громыхнуло).
#          между словами фразы допускается до 2 лишних слов.
# cooldown: секунды до повторного срабатывания (по умолчанию 1.5)
# scary: true — не звучит в режиме kids

sword_clash:
  phrases: ["удар меч", "ударил мечом", "скрестил* клинк*", "звон стали", "звон клинк*", "клинки сошлись", "парировал", "удар щит", "щит* удар"]
sword_swing:
  phrases: ["взмахнул*", "замахнул*", "рубанул*", "рубит", "взмах меч*", "выхватил меч", "обнажил меч"]
punch:
  phrases: ["ударил", "удар", "пнул*", "стукнул*", "врезал*", "кулак*"]
  cooldown: 1.0
fall:
  phrases: ["упа*", "рухнул*", "свалил*", "грохнул*", "шлепнул*", "падени*", "споткнул*"]
arrow:
  phrases: ["стрел*", "выстрел*", "лук* натянул*", "тетив*"]
fireball:
  phrases: ["огнен* шар", "огненный", "пламя вырвал*", "вспыхнул*", "поджег*", "огонь вырвал*"]
lightning:
  phrases: ["молни*", "разряд*"]
thunder:
  phrases: ["гром", "громыхнул*", "раскат*", "грянул* гром"]   # не "гром*": совпадёт с "громко"
ice:
  phrases: ["лед*", "заморозил*", "замерз*", "ледян*", "иней"]
heal:
  phrases: ["исцел*", "вылечил*", "лечени*", "зелье здоров*", "раны затянул*"]
magic:
  phrases: ["заклинан*", "колд*", "наколдова*", "волшебн* палочк*", "взмахнул* палочк*", "чар*", "магия", "магическ*", "фея", "превратил*"]
  cooldown: 2.0
explosion:
  phrases: ["взрыв*", "взорва*", "бабах*"]
  scary: true
door_knock:
  phrases: ["постуча*", "стук*", "тук тук"]
door_creak:
  phrases: ["двер* скрип*", "скрип*", "двер* открыл*", "отворил*", "распахнул*"]
footsteps:
  phrases: ["шаг*", "зашага*", "крадет*", "подкрал*", "топот*"]   # не "пошел": "пошел дождь"
  cooldown: 4.0
roar:
  phrases: ["зарыча*", "рычан*", "рык", "дракон* взревел*", "взревел*", "рев*", "медвед* зарыч*"]
  scary: true
wolf_howl:
  phrases: ["завыл*", "вой", "волк* вы*", "вол* завыл*"]
owl:
  phrases: ["сов* ух*", "ухнул*", "филин*", "сова"]
bird:
  phrases: ["птиц* запел*", "птичк*", "чирик*", "запела птица", "щебет*"]
  cooldown: 4.0
coins:
  phrases: ["монет*", "золот* монет*", "кошел*", "звякнул*", "заплатил*"]
splash:
  phrases: ["плюх*", "всплеск*", "прыгнул* в вод*", "упал* в вод*", "нырнул*", "брызг*"]
bell:
  phrases: ["колокол*", "звон* колокол*", "зазвенел*"]
horse:
  phrases: ["кон* поскакал*", "поскакал*", "галоп*", "лошад*", "скакун*", "копыт*"]
  cooldown: 4.0
