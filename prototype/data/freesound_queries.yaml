  bell:         {queries: ["church bell", "bell toll", "large bell ring"], min: 1, max: 15, cut: 5.0}
  arrow:        {queries: ["arrow shot", "bow arrow release", "arrow whoosh impact"], min: 0.2, max: 3, cut: 1.5}
  thunder:      {queries: ["thunder clap", "thunder rumble", "thunder strike"], min: 1, max: 12, cut: 5.0}

