  explosion:    {queries: ["explosion", "big explosion boom", "cannon explosion"], min: 0.5, max: 8, cut: 4.0}
  door_knock:   {queries: ["door knock", "knocking wooden door", "knock knock"], min: 0.3, max: 4, cut: 2.5}
  door_creak:   {queries: ["door creak", "creaky door open", "old door squeak"], min: 0.5, max: 6, cut: 3.5}
  footsteps:    {queries: ["footsteps stone", "footsteps walking", "footsteps wood floor"], min: 1.5, max: 15, cut: 3.5}
  wolf_howl:    {queries: ["wolf howl", "wolf howling", "wolves howling"], min: 1, max: 15, cut: 5.0}
  roar:         {queries: ["monster roar", "dragon roar", "beast growl roar"], min: 0.5, max: 6, cut: 3.5}
  bird:         {queries: ["bird chirp", "songbird singing", "birds tweet"], min: 0.5, max: 10, cut: 3.0}
  owl:          {queries: ["owl hoot", "owl hooting", "tawny owl"], min: 0.5, max: 10, cut: 3.0}
