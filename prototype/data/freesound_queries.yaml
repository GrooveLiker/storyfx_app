# Поисковые запросы Freesound для каждого звука (tools/fetch_freesound.py).
# Ищем только лицензию CC0. Запросы — по-английски: так на Freesound больше результатов.
# queries: пробуются по порядку, пока не наберётся нужное число кандидатов.
# min/max: длительность исходника в секундах (фильтр поиска).
# cut: для действий — максимум секунд после обрезки тишины; для фона — длина петли.

