# Персонажи → звук при появлении в рассказе. Откуда список — docs/characters.md
# names: как персонажа называют в тексте. Синтаксис как у keywords в scenes.yaml:
#   основа слова («кот» → кота, коту) или префикс со «*». Короткие основы (< 3 букв) сравниваются целым словом,
#   поэтому формы перечислены («яга», «яги», «ягу»). «=слово» — только это слово, без основы.
# Пересечения: побеждает более длинное имя («дед мороз» → frost, а не old_man).
# title: имя для людей (каталог звуков). quiet_moods: в этих настроениях голос молчит (смех ребёнка в беде).
# voiced_by: звуки действий, которые и есть голос персонажа — если такой только что прозвучал, это его появление
#   («Морозко на ёлке потрескивает» — треск и есть Морозко), второй звук не нужен.
# quiet_words: с этими словами в той же фразе голос молчит сразу, не дожидаясь настроения («подхватили мальчика»). sound: файл sounds/sfx/<sound>.wav (можно переиспользовать звук действия).

# leave: глаголы ухода — персонаж в той же части фразы уходит со сцены («заяц убежал»);
# при следующем упоминании он снова «появится» со звуком.
leave: ["ушел", "ушла", "ушли", "уходит", "уход*", "убежа*", "убега*", "улете*", "улета*", "уплы*", "ускака*",
        "укатил*", "уполз*", "исчез*", "скрыл*", "пропал*", "удрал*", "умчал*", "вышел из", "вышла из", "покинул*"]
# leave_speakers: если в части фразы с глаголом ухода есть эти слова, уходит говорящий или собеседник,
# а не последний названный персонаж: «я от волка ушёл» (песня колобка) — волк остаётся на сцене.
leave_speakers: ["я", "мы", "ты", "вы"]
# leave_witness: оборот «только медведь его и видел» — персонаж остаётся, уходит другой (колобок).
# before — слово перед именем, after — одно из слов в 3 словах после имени.
leave_witness: {before: ["только"], after: ["видел*"]}

