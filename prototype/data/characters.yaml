# Персонажи → звук при появлении в рассказе. Откуда список — docs/characters.md
# names: как персонажа называют в тексте. Синтаксис как у keywords в scenes.yaml:
#   основа слова («кот» → кота, коту) или префикс со «*». Короткие основы (< 3 букв) сравниваются целым словом,
#   поэтому формы перечислены («яга», «яги», «ягу»). «=слово» — только это слово, без основы.
# Пересечения: побеждает более длинное имя («дед мороз» → frost, а не old_man).
# title: имя для людей (каталог звуков). quiet_moods: в этих настроениях голос молчит (смех ребёнка в беде). sound: файл sounds/sfx/<sound>.wav (можно переиспользовать звук действия).

# leave: глаголы ухода — персонаж в той же части фразы уходит со сцены («заяц убежал»);
# при следующем упоминании он снова «появится» со звуком.
leave: ["ушел", "ушла", "ушли", "уходит", "уход*", "убежа*", "убега*", "улете*", "улета*", "уплы*", "ускака*",
        "укатил*", "уполз*", "исчез*", "скрыл*", "пропал*", "удрал*", "умчал*", "вышел из", "вышла из", "покинул*"]

characters:
  bear:      {title: "Медведь", sound: bear_growl,  names: ["медвед*", "медвежон*", "медвежат*", "мишк*", "михайл* потапыч*", "топтыгин*", "балу"]}
  wolf:      {title: "Волк", sound: wolf_howl,   names: ["волк", "волч*", "волчиц*"]}
  fox:       {title: "Лиса", sound: fox_yelp,    names: ["лис", "лисиц*", "лисичк*", "лисоньк*"]}
  cat:       {title: "Кот", sound: cat_meow,    names: ["кот", "котик*", "котейк*", "котофе*", "котен*", "котят*", "кошк*", "кошечк*", "матроскин*"]}
  king:      {title: "Царь, король", sound: fanfare,     names: ["цар", "корол", "государ"]}
  hare:      {title: "Заяц", sound: hare_hop,    names: ["заяц", "зайц*", "зайч*", "заюш*", "зайк*"]}
  old_man:   {title: "Дед, старик", sound: old_man_grunt, names: ["дед", "дедушк*", "старик*", "старич*"]}
  rooster:   {title: "Петух", sound: rooster,     names: ["петух*", "петуш*"]}
  old_woman: {title: "Баба, старуха", sound: old_woman_sigh, names: ["баб", "бабк*", "бабушк*", "старух*", "старушк*"]}
  child:     {title: "Дети, девочка, мальчик", sound: child_laugh, quiet_moods: [tense, action], names: ["дет", "детвор*", "ребенок", "ребенк*", "малыш*", "девочк*", "мальчик*", "маш", "машеньк*"]}
  mouse:     {title: "Мышка", sound: mouse_squeak, names: ["мыш*", "мышк*"]}
  frog:      {title: "Лягушка", sound: frog_croak,  names: ["лягуш*", "лягушон*", "жаб*"]}
  dog:       {title: "Собака", sound: dog_bark,    names: ["собак*", "собачк*", "=пес", "=пса", "=псу", "=псом", "=псы", "=псов", "щен*", "жучк*"]}
  horse:     {title: "Лошадь, конь", sound: horse_snort, names: ["лошад*", "кон", "конь", "сивк* бурк*", "горбунок*"]}
  villain:   {title: "Кощей, Бармалей, разбойники", sound: evil_laugh, names: ["кощ*", "бармале*", "разбойник*", "карабас*"]}
  magic:     {title: "Жар-птица, золотая рыбка, фея", sound: magic,       names: ["жар птиц*", "золот* рыбк*", "фея", "феи", "фею", "феей", "волшебниц*"]}
  witch:     {title: "Баба-яга", sound: witch_cackle, names: ["баб* яга", "баб* яги", "баб* ягу", "баб* ягой", "яга", "яги", "ягу", "ягой", "бабк* ежк*"]}
  goose:     {title: "Гуси-лебеди", sound: goose_honk,  names: ["гус", "гусят*", "гусен*", "лебед*"]}
  bird:      {title: "Птица (журавль, цапля, воробей)", sound: bird,        names: ["журавл*", "цапл*", "ласточк*", "воробей", "воробь*", "птиц*", "птичк*", "синиц*"]}
  dragon:    {title: "Змей Горыныч, дракон, чудище", sound: roar, names: ["змей горыныч*", "горыныч*", "дракон*", "чуд* юд*", "чудищ*", "тигр*", "шерхан*"]}
  duck:      {title: "Утка", sound: duck_quack,  names: ["утк", "уточк*", "утен*", "утят*", "селезн*"]}
  frost:     {title: "Морозко, Снежная королева", sound: ice,         names: ["морозк*", "мороз иванович*", "дед* мороз*", "снежн* королев*"]}
  insect:    {title: "Муха, комар, пчела", sound: insect_buzz, names: ["мух", "мушк*", "цокотух*", "комар*", "пчел*", "пчелк*", "шмел*"]}
  monkey:    {title: "Обезьяна", sound: monkey,      names: ["обезьян*", "мартышк*"]}
  cow:       {title: "Корова", sound: cow_moo,     names: ["коров*", "бурен*"]}
  goat:      {title: "Коза, козлята, баран", sound: goat_bleat,  names: ["коз", "козел", "козл*", "козлят*", "козочк*", "козлен*", "баран*", "овц*", "овечк*"]}
  giant:     {title: "Великан, людоед", sound: giant_steps, names: ["великан*", "людоед*", "исполин*"]}
  hen:       {title: "Курица", sound: hen_cluck,   names: ["куриц*", "курочк*", "наседк*", "цыпл*"]}
  crow:      {title: "Ворона", sound: crow_caw,    names: ["=ворон", "=ворона", "=вороны", "=ворону", "=вороне", "воронен*", "воронят*"]}   # не «вороной» (масть коня)
  owl:       {title: "Сова", sound: owl,         names: ["сов", "совушк*", "филин*"]}
  nightingale: {title: "Соловей-разбойник", sound: whistle,   names: ["соловей разбойник*", "соловь* разбойник*", "соловей", "соловь*"]}
  pike:      {title: "Щука", sound: splash,      names: ["щук*"]}
  hedgehog:  {title: "Ёжик", sound: hedgehog_snuffle, names: ["еж", "ежа", "ежу", "ежом", "ежик*", "ежих*", "ежат*"]}
  elephant:  {title: "Слон", sound: elephant,    names: ["слон", "слоник*", "слоних*", "слонен*"]}
  snake:     {title: "Удав, змея", sound: snake_hiss,  names: ["удав*", "кобр*", "змеюк*", "каа"]}
  donkey:    {title: "Осёл", sound: donkey_bray, names: ["осел", "осл", "ослик*"]}
  carlson:   {title: "Карлсон", sound: propeller,   names: ["карлсон*"]}
  pinocchio: {title: "Буратино", sound: door_knock,  names: ["буратин*"]}
