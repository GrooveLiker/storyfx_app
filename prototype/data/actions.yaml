          "поскакал*", "прискакал*", "ускакал*", "скакал*", "галоп*", "копыт*", "всадник*", "табун*", "пришпорил*"]
  cooldown: 4
  variants:
    horse_gallop:
      examples:
        - "лошадь прискакала"
        - "всадник мчался галопом"
        - "конь поскакал по дороге"
        - "к замку подъехал всадник на коне"
        - "принц вскочил на коня и умчался"
        - "табун лошадей пронёсся мимо"
        - "вскочил в седло и поскакал домой"             # контрольная №2 (2026-11-23): «поскакала домой» было фырканьем
        - "поскакали обратно во весь опор"
        - "она поскакала в деревню"
        - "гонец примчался на взмыленном коне"
        - "кони мчались по полю"
        - "отряд пришпорил коней"
        - "вдалеке застучали копыта"
        - "запряг лошадь и поехал в город"      # запряг — значит, поедет: копыта (живой тест 2026-11-22)
        - "конюх запряг коня в телегу и тронулся"
        - "впряг кобылу в повозку и поехал"
        - "сел на коня и поехал"
    horse_snort:
      examples:
        - "он погладил лошадь"
        - "конь фыркнул"
        - "лошадь тихо заржала"
        - "она дала коню морковку"
        - "похлопал коня по шее"
        - "кобыла ткнулась мордой в ладонь"
        - "лошадь жевала овёс"
        - "конь беспокойно переступил и фыркнул"
        - "девочка угостила пони яблоком"
        - "мальчик осторожно подошёл к коню"      # D-011: решаем по 1–2 словам — «подошёл к» = спокойно, не скачет
        - "старик подошёл к своей кобыле"
        - "подбежал к жеребёнку и обнял его"
        - "мужик запряг лошадь в сани"           # запрячь и стоять — фырканье; «запряг и поехал» — копыта
        - "запряг кобылу в дровни, подвёл ко крыльцу"
        - "ведёт лошадку под уздцы"              # шагом, не галоп (живой тест: «лошадку везёт»)
        - "лошадка медленно везёт воз"
        - "мужик вёл коня за повод"
        - "лошадь тянет телегу в гору"
    _none:
      examples:
        - "у рыцаря была лошадь"
        - "он купил коня на рынке"
        - "лошадь была белой масти"
        - "в деревне жил конюх"
        - "о его коне ходили легенды"
        - "она мечтала о собственной лошадке"
        - "король подарил дочери коня"
        - "на ярмарке купила себе коня"                   # покупка — не звук (было фырканье)
        - "выменял коня на корову"
        - "продал старого коня цыганам"

