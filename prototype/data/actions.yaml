# Звуки действий по СМЫСЛУ фразы. Формат и правила — docs/sounds.md
#
# Группа = тема. topic — слова-якоря: если в части фразы есть такое слово,
# эта часть фразы (до союза «и/а/но/потом…») отдаётся классификатору группы,
# и он по смыслу выбирает вариант (звук) или «_none» — тема упомянута, звука не нужно.
#
# variants.<id>.examples — 6–10 разных фраз о том, когда звучит этот звук.
#   id = имя файла sounds/sfx/<id>.wav; «_none» — специальный вариант «без звука».
# Синтаксис topic — основа слова, «префикс*» или «=точное слово».
#   Осторожно с основами: «ворота» и «воротился» дают одну основу «ворот», «золото» и «золотая» — «золот».
#   Проверка на сказках (tests/test_stories.py) ловит такие ложные срабатывания.
# Имена зверей — НЕ якоря: появление персонажа озвучивает его голос (characters.yaml); здесь — только звуки-глаголы.
# cooldown — секунды до повтора того же звука (по умолчанию 1.5).

fight:
  topic: ["удар*", "бил", "бьет", "избил*", "рубанул*", "рубит", "взмахнул*", "замахнул*", "меч*", "клинк*", "клинок",
          "сабл*", "топор*", "кинжал*", "кулак*", "пнул*", "врезал*", "стукнул*", "парировал*", "щит*", "выхватил*", "обнажил*",
          "молот*", "булав*", "дубин*", "палиц*", "кистен*", "секир*", "вонзил*", "пронзил*", "заколол*", "проткнул*",
          "копь*", "=копье", "нож", "ножа", "ножом", "огрел*"]   # задача 24: дробящее и колющее
  variants:
    sword_clash:
      cues: ["меч", "мечом", "меча", "мечи", "клинк*", "клинок", "сабл*", "шпаг*", "топор*"]   # подсказки: чем бьют — то и звучит (задача 24)
      examples:
        - "ударил мечом по щиту"
        - "клинки со звоном скрестились"
        - "рыцарь парировал удар"
        - "сталь ударила о сталь"
        - "меч обрушился на доспехи"
        - "он рубанул топором по шлему"
        - "противники бились на мечах"
        - "клинок наткнулся на щит"
        - "что есть силы ударил мечом по доспеху"     # мечом — звон, даже «с силой» (не дробящий)
        - "с размаху рубанул клинком по щиту"
        - "рыцарь со всей силы ударил саблей по шлему"
        - "ударил мечом по врагу"                # короткое «ударил мечом по…» — звон, не взмах
        - "ударил его мечом"
    sword_swing:
      cues: ["меч", "мечом", "меча", "мечи", "клинк*", "клинок", "сабл*", "шпаг*", "топор*"]
      examples:
        - "воин выхватил меч"
        - "он взмахнул мечом"
        - "рыцарь замахнулся топором"
        - "она обнажила клинок"
        - "меч со свистом рассёк воздух"
        - "разбойник выхватил кинжал"
        - "он крутанул саблей над головой"
        - "рыцарь вытащил меч из ножен"
        - "воин схватился за меч"
        - "выхватил меч"
        - "паладин поднял меч над головой"
        - "машет топором"                       # живой тест: «по пятам топором машут»
    punch:
      cues: ["кулак*", "пнул*", "оплеух*", "тумак*", "пощечин*"]
      examples:
        - "ударил кулаком в челюсть"
        - "врезал ему по носу"
        - "пнул врага ногой"
        - "стукнул по столу кулаком"
        - "дал хорошего тумака"
        - "ударил обидчика в живот"
        - "он избил разбойника"
        - "заехал ему кулаком в ухо"
        - "кулак врезался в скулу"
        - "отвесил оплеуху"
        - "дал пинка под зад"
    heavy_hit:          # молот, булава, дубина (задача 24)
      cues: ["молот*", "булав*", "дубин*", "палиц*", "кистен*", "секир*"]
      examples:
        - "гном обрушил боевой молот на голову орка"
        - "булава смяла помятый доспех"
        - "огрел разбойника дубиной по спине"
        - "тролль размахнулся палицей и ударил"
        - "кистенём со всего маху по шлему"
        - "молот с грохотом опустился на врага"
        - "паладин ударил булавой по скелету"
        - "ударил молотом"
        - "булавой по голове"
        - "размахнулся молотом"
        - "дубиной по хребту"
        - "молот обрушился на щит"
    stab:               # кинжал, копьё, нож
      cues: ["кинжал*", "копь*", "=копье", "нож", "ножом", "ножа", "пронзил*", "вонзил*", "заколол*", "проткнул*"]
      examples:
        - "вонзил кинжал в спину"
        - "пронзил врага копьём"
        - "ударил стражника ножом"
        - "заколол часового кинжалом"
        - "клинок вошёл между рёбер"
        - "проткнул чудище насквозь"
        - "копьё пробило щит и вошло в грудь"
        - "насквозь пробил разбойника"
        - "метнул нож в спину бегущему"
        - "кинжал вонзился ему в горло"
        - "пронзил первого из нападавших"
        - "пронзил стражника мечом"
        - "пронзил орка"                        # короткие: решение часто по 1–2 словам после якоря
        - "пронзил его"
        - "вонзил нож"
        - "заколол его"
    _none:
      examples:
        - "на поясе висел старый меч"
        - "кузнец выковал новый клинок"
        - "он купил щит на рынке"
        - "меч был очень тяжёлым"
        - "это был удар судьбы"
        - "новость стала для него ударом"
        - "у входа стояли воины с топорами"
        - "стражники держали секиры на плечах"
        - "у дверей стража с бердышами"
        - "волшебник взмахнул посохом"
        - "она взмахнула рукой на прощание"
        - "птица взмахнула крыльями"
        - "дирижёр взмахнул палочкой"
        - "в кузнице лежал тяжёлый молот"
        - "копьё стояло у стены"
        - "нож для хлеба лежал на столе"
        - "булава висела на поясе у жреца"

horse:
