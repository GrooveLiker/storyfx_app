# Звуки действий по СМЫСЛУ фразы. Формат и правила — docs/sounds.md
#
# Группа = тема. topic — слова-якоря: если в части фразы есть такое слово,
# эта часть фразы (до союза «и/а/но/потом…») отдаётся классификатору группы,
# и он по смыслу выбирает вариант (звук) или «_none» — тема упомянута, звука не нужно.
#
# variants.<id>.examples — 6–10 разных фраз о том, когда звучит этот звук.
#   id = имя файла sounds/sfx/<id>.wav; «_none» — специальный вариант «без звука».
# Синтаксис topic — как phrases раньше: основа слова или «префикс*».
# scary: true — группа/вариант не звучит в режиме kids.
# cooldown — секунды до повтора того же звука (по умолчанию 1.5).

fight:
