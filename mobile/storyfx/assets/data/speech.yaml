# Признаки реплики героя в речи БЕЗ кавычек (голос, Vosk). Код — storyfx/speech.py, docs/architecture.md.
# Реплика не меняет место и погоду: «не ходи со двора» — не деревня, «хочу быть владычицей морскою» — не море.
# Отмечаем не всю фразу, а несколько слов после признака (window): фраза Vosk длинная, в ней и реплика,
# и повествование («…не едят тебя | побежала дальше, стоит молочная речка» — речка — место).

window: 6            # сколько слов после признака считать репликой (подобрано на голосе: 0 → 3 → 4 → 6 смен сцены 31 → 31 → 30 → 26)

# «я / ты / мой» — в сказках повествование от третьего лица, первое и второе лицо — голос героя
pronouns: [я, меня, мне, мной, ты, тебя, тебе, тобой, мы, нас, нам, нами, вы, вас, вам, вами,
           мой, моя, мое, моего, моей, моему, мою, мои, моих, моим,
           твой, твоя, твое, твоего, твоей, твоему, твою, твои, твоих, твоим]

# глаголы первого лица — тоже голос героя
first_person: [хочу, буду, пойду, поеду, могу, знаю, вижу, прошу, велю, дам, скажу, спрошу, отдам]

# повелительное наклонение — обращаются к кому-то
imperatives: [ступай, поди, подите, иди, идите, сходи, ходи, береги, спрячь, спрячьте, скажи, скажите, собери,
              поезжай, садись, садитесь, слушай, смотри, гляди, отдай, дай, дайте, возьми, неси, вези, увези,
              беги, бегите, спаси, помоги, пусти, прости, смилуйся, поклонись, ешь, съешь, отведай, жди,
              погоди, вставай, давай, пойдем, поедем, полезай, убирайся]

# на этом окно реплики кончается: глагол прошедшего времени по окончанию — обычно снова рассказчик
# («…не едят тебя побежала дальше»). Окончания — после основы не короче 3 букв.
narration_endings: [ала, яла, ела, ила, ула, ыла, али, яли, ели, или, ули, ыли]
